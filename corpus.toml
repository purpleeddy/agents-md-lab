# Corpus manifest for the instruction-file comparison.
#
# Each [[files]] entry pins one public AGENTS.md or CLAUDE.md by commit. Only files of 200 lines
# or fewer are surveyed, because the comparison is about what a short instruction file says, not
# about how much a long one can say. Files left out for length are listed under [[excluded]].
#
# commit  : full 40-hex SHA of a commit that contains the file at `path`
# license : SPDX identifier of the source repository, or "NONE" when the repository has no
#           license file; a "NONE" entry is never quoted, only counted and cited by line number
# type    : the file name, "AGENTS.md" or "CLAUDE.md"
# why     : why the file is in the survey
#
# Machine fields (stars, sha256, bytes, lines, verdicts) are written by
# `python3 scripts/compare.py --refresh` into docs/data/comparison.json.
#
# Notes on resolution (2026-09-03):
# - omacom/omarchy is the repository's current name; it is still widely cited as basecamp/omarchy,
#   which redirects to it, so the former name is recorded in `formerly`.
# - trailofbits was considered for [[excluded]] and dropped: trailofbits/claude-code-config has
#   no AGENTS.md or CLAUDE.md at its root, and its `claude-md-template.md` is a template of 107
#   lines, so the "over 200 lines" reason would not hold.

[[files]]
key = "agentsmd-sample"
repo = "openai/agents.md"
path = "AGENTS.md"
commit = "ba9474a69e9a2c0c4176713843b78e8f54377941"
license = "MIT"
type = "AGENTS.md"
why = "The sample file published by the AGENTS.md format site itself, so it shows what the format recommends."

