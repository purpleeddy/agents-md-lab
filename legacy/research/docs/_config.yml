title: agents-md-lab
description: >-
  A survey of ten published AGENTS.md and CLAUDE.md files against ten sourced criteria,
  with a pre-registered experiment on what an instruction file changes.
markdown: kramdown
# A page gets a layout only when something names one. Without this every Markdown page would
# publish as a bare HTML fragment. index.html has no front matter, so `type: pages` leaves it
# alone; the layout itself is `_layouts/default.html` in this directory.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
kramdown:
  footnote_nr: 1
exclude:
  - Gemfile
  - Gemfile.lock
