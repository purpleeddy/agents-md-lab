<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light">
<title>{{TITLE}} · agents-md-lab</title>
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="en" href="{{EN_URL}}">
<link rel="alternate" hreflang="ko" href="{{KO_URL}}">
<link rel="alternate" hreflang="x-default" href="{{EN_URL}}">
<link rel="stylesheet" href="{{CSS}}">
<script src="{{JS}}" defer></script>
</head>
<body data-copy-success="{{COPY_SUCCESS}}" data-copy-failure="{{COPY_FAILURE}}" data-artifact-url="{{ARTIFACT_URL}}">
<a class="skip-link" href="#main">{{SKIP}}</a>
<header class="site-header">
<div class="header-inner wrap">
<a class="brand" href="{{HOME}}" aria-label="agents-md-lab"><span class="brand-symbol" aria-hidden="true">a<span>.</span></span><span>agents-md-lab</span></a>
<nav class="primary-nav" aria-label="{{PRIMARY_LABEL}}">{{NAV}}</nav>
<a class="locale-switch" href="{{OTHER_URL}}" hreflang="{{OTHER_LANG}}" lang="{{OTHER_LANG}}" data-locale-switch>{{OTHER_LABEL}} <span aria-hidden="true">↗</span></a>
</div>
</header>
<main id="main" class="wrap main-layout" tabindex="-1">{{SIDEBAR}}<div class="main-content">{{CONTENT}}</div></main>
<footer class="site-footer"><div class="wrap footer-inner"><div><a class="brand footer-brand" href="{{HOME}}">agents-md-lab</a><p>{{FOOTER}}</p></div><nav aria-label="{{FOOTER_LABEL}}"><a href="{{GUIDE}}">{{GUIDE_LABEL}}</a><a href="{{EVIDENCE}}">{{EVIDENCE_LABEL}}</a><a href="https://github.com/purpleeddy/agents-md-lab">GitHub ↗</a><span>v{{REVISION}} · MIT</span></nav></div></footer>
</body>
</html>
